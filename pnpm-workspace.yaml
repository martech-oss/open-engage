packages:
  - apps/*
  - packages/*

catalog:
  typescript: ^7.0.2
  vitest: ^4.0.17
  zod: ^4.4.3

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
allowBuilds:
  "@google/genai": false
  "@mongodb-js/zstd": false
  better-sqlite3: false
  core-js-pure: false
  esbuild: true
  node-liblzma: false
  protobufjs: false
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20260728.1"
  - "@modelcontextprotocol/sdk@1.30.0"
  - "@cloudflare/vite-plugin@1.48.0"
  - miniflare@4.20260722.1
  - wrangler@4.115.0
  - "@orpc/client@1.14.13"
  - "@orpc/contract@1.14.13"
  - "@orpc/interop@1.14.13"
  - "@orpc/server@1.14.13"
  - "@orpc/shared@1.14.13"
  - "@orpc/standard-server-aws-lambda@1.14.13"
  - "@orpc/standard-server-fastify@1.14.13"
  - "@orpc/standard-server-fetch@1.14.13"
  - "@orpc/standard-server-node@1.14.13"
  - "@orpc/standard-server-peer@1.14.13"
  - "@orpc/standard-server@1.14.13"
  - "@orpc/tanstack-query@1.14.13"
